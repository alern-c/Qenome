[project]
name = "qenome-dev"
version = "0.0.0"
description = "Development tools for the Qenome repository"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/test_stage_npm.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = false
files = ["scripts"]
