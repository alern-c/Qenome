name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Zig (resolved from build.zig.zon)
        uses: mlugg/setup-zig@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.12"

      - name: Run every quality check
        run: python3 scripts/check_all.py

  skill-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Zig (resolved from build.zig.zon)
        uses: mlugg/setup-zig@v2

      - name: Build qenome
        run: zig build

      - name: Run the skill examples
        run: python3 scripts/check_skill_examples.py
