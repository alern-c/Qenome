name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Read the runner CPU model for the Zig cache key
        id: cpu_model
        run: |
          model="$(grep -m1 '^model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2- | sed 's/^[[:space:]]*//' || true)"
          echo "Runner CPU model: ${model:-unknown}"
          cache_key="$(printf '%s' "$model" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//')"
          echo "Zig cache key component: ${cache_key:-unknown}"
          printf 'cache_key=%s\n' "${cache_key:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Set up Zig (resolved from build.zig.zon)
        uses: mlugg/setup-zig@v2
        with:
          cache-key: ${{ steps.cpu_model.outputs.cache_key }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.12"

      - name: Run every quality check
        run: python3 scripts/check_all.py

  skill-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Read the runner CPU model for the Zig cache key
        id: cpu_model
        run: |
          model="$(grep -m1 '^model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2- | sed 's/^[[:space:]]*//' || true)"
          echo "Runner CPU model: ${model:-unknown}"
          cache_key="$(printf '%s' "$model" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//')"
          echo "Zig cache key component: ${cache_key:-unknown}"
          printf 'cache_key=%s\n' "${cache_key:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Set up Zig (resolved from build.zig.zon)
        uses: mlugg/setup-zig@v2
        with:
          cache-key: ${{ steps.cpu_model.outputs.cache_key }}

      - name: Build qenome
        run: zig build

      - name: Run the skill examples
        run: python3 scripts/check_skill_examples.py
