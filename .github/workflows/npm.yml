name: npm

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the runner CPU model for the Zig cache key
        id: cpu_model
        run: |
          model=""
          if [ -r /proc/cpuinfo ]; then
            while IFS= read -r line; do
              case "$line" in
                'model name'*)
                  IFS=: read -r _ model <<< "$line"
                  break
                  ;;
              esac
            done < /proc/cpuinfo
          fi
          model="$(printf '%s' "$model" | sed 's/^[[:space:]]*//')"
          cache_key="$(printf '%s' "$model" | tr '[:upper:]' '[:lower:]')"
          cache_key="$(printf '%s' "$cache_key" | tr -cs 'a-z0-9' '-')"
          cache_key="$(printf '%s' "$cache_key" | sed -e 's/^-//' -e 's/-$//')"
          if [ -z "$cache_key" ]; then
            cache_key=unknown
          fi
          echo "Runner CPU model: ${model:-unknown}"
          echo "Zig cache key component: $cache_key"
          printf 'cache_key=%s\n' "$cache_key" >> "$GITHUB_OUTPUT"

      - name: Set up Zig (resolved from build.zig.zon)
        uses: mlugg/setup-zig@v2
        with:
          cache-key: ${{ steps.cpu_model.outputs.cache_key }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Cross-compile, pack, and dry-run every package
        run: python3 scripts/stage_npm.py --pack

      - name: Upload the packed tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: dist/npm/*.tgz
          if-no-files-found: error

  smoke:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Download the packed tarballs
        uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: dist/npm

      - name: Install the tarballs and run npx qenome --version
        env:
          QENOME_SMOKE_TARGET: ${{ matrix.target }}
        run: python3 scripts/smoke_npm.py
