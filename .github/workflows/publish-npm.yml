name: publish-npm

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  guard:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require main at the released tag
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/require_npm_release.py

  quality:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  publish:
    needs: [guard, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Zig (resolved from build.zig.zon)
        uses: mlugg/setup-zig@v2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install the current npm for trusted publishing
        run: npm install -g npm@latest

      - name: Stage the packages from build.zig.zon
        run: python3 scripts/stage_npm.py

      - name: Publish with OIDC and provenance
        run: python3 scripts/publish_npm.py --publish

      - name: Install the published version and compare one case
        run: python3 scripts/verify_published_npm.py
